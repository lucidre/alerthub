name: alerthub
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  async: ^2.8.2
  auto_route: ^9.2.0
  cached_network_image: ^3.2.1
  cloud_firestore: ^5.4.2
  collection: ^1.18.0
  connectivity_plus: ^6.0.5
  country_picker: ^2.0.26
  cupertino_icons: ^1.0.2
  firebase_auth: ^5.3.0
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  bluetooth_classic: ^0.0.4
  firebase_storage: ^12.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.1.0
  # flutter_bluetooth_serial: ^0.4.0

  flutter_dotenv: ^5.1.0
  flutter_localizations:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.2
  focus_detector: ^2.0.1
  get: ^4.6.5
  google_maps_flutter: ^2.9.0
  google_places_flutter: ^2.0.9
  http: ^1.2.2
  image_picker: ^1.0.7
  intl: ^0.20.0
  location: ^6.0.2
  lottie: ^3.1.2
  map_location_picker: ^1.3.0
  # permission_handler: ^12.0.1
  pull_to_refresh: ^2.0.0
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  top_snackbar_flutter: ^3.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  auto_route_generator: ^9.0.0
  build_runner: ^2.2.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/lottie/
    - assets/fonts/
    - assets/.env

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.otf
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Italic.otf
          style: italic
